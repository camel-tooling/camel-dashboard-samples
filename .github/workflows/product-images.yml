name: Publish product images

on:
  workflow_dispatch:
    inputs:
      camel-spring-boot-version:
        description: "The Camel version to use for Spring Boot (see https://access.redhat.com/articles/7021827?#headerCSB)"
        required: true
        type: string
      spring-boot-version:
        description: "The Spring Boot version to use (see https://access.redhat.com/articles/7021827?#headerCSB)"
        required: false
        type: string
      quarkus-platform-version:
        description: "The Quarkus platform version to use (https://access.redhat.com/articles/7021827?#headerCEQ)"
        required: true
        type: string
      container-label:
        description: "The label to use for these images (ie, 4.18.x-redhat)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: obs-svc
            subproject: quarkus
            image-prefix: sample-db-app
          - app: obs-svc
            subproject: sb
            image-prefix: sample-db-app
          - app: regular
            subproject: quarkus
            image-prefix: sample-db-regular-app
          - app: regular
            subproject: sb
            image-prefix: sample-db-regular-app

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        working-directory: ${{ matrix.app }}/${{ matrix.subproject }}
        run: |
          sed -i "s|<!-- you can change this --><version>[^<]*</version>|<!-- you can change this --><version>${{ inputs.spring-boot-version }}</version>|" pom.xml

          ./mvnw -B clean package \
            -Dcamel.version=${{ inputs.camel-spring-boot-version }} \
            -Dspring-boot.version=${{ inputs.spring-boot-version }} \
            -Dquarkus.platform.group-id=com.redhat.quarkus.platform \
            -Dquarkus.platform.version=${{ inputs.quarkus-platform-version }} \
            -s ../../rh-ga-settings.xml

      - name: Login to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app }}/${{ matrix.subproject }}
          file: ${{ matrix.app }}/${{ matrix.subproject }}/src/main/docker/Dockerfile
          push: true
          tags: quay.io/camel-tooling/${{ matrix.image-prefix }}-${{ matrix.subproject }}:${{ inputs.container-label }}
