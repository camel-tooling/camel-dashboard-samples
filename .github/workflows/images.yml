name: Build and publish images

on:
  workflow_dispatch:
    inputs:
      camel-version:
        description: "The camel version to use"
        required: false
        default: "4.22.0"
        type: string
      camel-maven-plugin-version:
        description: "The camel maven plugin version to use (may be missing in product, use the community one)"
        required: false
        default: "4.22.0"
        type: string
      image-suffix:
        description: "The suffix for container image (ie, -redhat)"
        required: false
        type: string
      quarkus-platform-group-id:
        description: "The maven coordinate group (community or product)"
        required: true
        default: "io.quarkus.platform"
        type: choice
        options:
          - io.quarkus.platform
          - com.redhat.quarkus.platform
      quarkus-platform-version:
        description: "The quarkus platform version to use"
        required: false
        default: "3.39.1"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: obs-svc
            subproject: main
            image-prefix: sample-db-app
          - app: obs-svc
            subproject: quarkus
            image-prefix: sample-db-app
          - app: obs-svc
            subproject: sb
            image-prefix: sample-db-app
          - app: regular
            subproject: main
            image-prefix: sample-db-regular-app
          - app: regular
            subproject: quarkus
            image-prefix: sample-db-regular-app
          - app: regular
            subproject: sb
            image-prefix: sample-db-regular-app

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        working-directory: ${{ matrix.app }}/${{ matrix.subproject }}
        run: |
          ./mvnw -B clean package \
            -Dcamel.version=${{ inputs.camel-version }} \
            -Dcamel.maven.plugin.version=${{ inputs.camel-maven-plugin-version }} \
            -Dquarkus.platform.group-id=${{ inputs.quarkus-platform-group-id }} \
            -Dquarkus.platform.version=${{ inputs.quarkus-platform-version }} \
            -s ../../rh-ga-settings.xml

      - name: Login to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app }}/${{ matrix.subproject }}
          file: ${{ matrix.app }}/${{ matrix.subproject }}/src/main/docker/Dockerfile
          push: true
          tags: quay.io/camel-tooling/${{ matrix.image-prefix }}-${{ matrix.subproject }}${{ inputs.image-suffix }}:${{ inputs.camel-version }}
