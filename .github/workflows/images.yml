name: Build and publish images

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: obs-svc
            subproject: main
            image-prefix: sample-db-app
          - app: obs-svc
            subproject: quarkus
            image-prefix: sample-db-app
          - app: obs-svc
            subproject: sb
            image-prefix: sample-db-app
          - app: regular
            subproject: main
            image-prefix: sample-db-regular-app
          - app: regular
            subproject: quarkus
            image-prefix: sample-db-regular-app
          - app: regular
            subproject: sb
            image-prefix: sample-db-regular-app

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        working-directory: ${{ matrix.app }}/${{ matrix.subproject }}
        run: ./mvnw -B clean package

      - name: Extract Camel version
        id: camel
        working-directory: ${{ matrix.app }}/${{ matrix.subproject }}
        run: |
          CAMEL_VERSION=$(./mvnw -B dependency:tree -Dincludes=org.apache.camel:camel-support 2>/dev/null \
            | grep 'camel-support:jar' | head -1 \
            | sed -n 's/.*camel-support:jar:\([^:]*\):.*/\1/p')
          if [ -z "$CAMEL_VERSION" ]; then
            echo "::error::Failed to extract Camel version from dependency tree"
            exit 1
          fi
          echo "version=$CAMEL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app }}/${{ matrix.subproject }}
          file: ${{ matrix.app }}/${{ matrix.subproject }}/src/main/docker/Dockerfile
          push: true
          tags: quay.io/camel-tooling/${{ matrix.image-prefix }}-${{ matrix.subproject }}:${{ steps.camel.outputs.version }}
